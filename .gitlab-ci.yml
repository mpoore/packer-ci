workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never

variables:
  FF_TIMESTAMPS: true
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build

# RUNNER_IMAGE_MIRROR is an optional prefix (include the trailing slash, e.g.
# "myregistry.example.com/dockerhub/") pointing at a pull-through cache for
# the docker:latest/docker:dind images the job itself runs on. Leave unset to
# pull them from Docker Hub as normal.
default:
  image: ${RUNNER_IMAGE_MIRROR}docker:latest
  services:
    - name: ${RUNNER_IMAGE_MIRROR}docker:dind

before_script:
  - apk add -q git jq
  # Wait for the dind service to be ready before using the Docker client against it
  - |
    for i in $(seq 1 30); do
      docker info >/dev/null 2>&1 && break
      echo "Waiting for Docker daemon..."
      sleep 5
    done
  - docker info
  # Retry wrapper for flaky network operations (e.g. registry pushes), which
  # have no built-in retry of their own, unlike curl.
  - |
    retry() {
      n=1
      max=5
      delay=10
      until "$@"; do
        if [ "$n" -ge "$max" ]; then
          echo "Command failed after $n attempts: $*" >&2
          return 1
        fi
        echo "Attempt $n/$max failed, retrying in ${delay}s..." >&2
        sleep "$delay"
        n=$((n + 1))
      done
    }
  # Signs an image digest with cosign. Keyless (Sigstore OIDC, via the
  # SIGSTORE_ID_TOKEN id_token) by default; set $COSIGN_KEY as a protected,
  # File-type CI/CD variable (and $COSIGN_PASSWORD if the key is encrypted)
  # to sign with a static key instead. The public Rekor transparency log is
  # used unless $COSIGN_TLOG_UPLOAD is set to "false".
  - |
    cosign_sign() {
      args="--yes"
      [ -n "$COSIGN_KEY" ] && args="$args --key $COSIGN_KEY"
      [ "$COSIGN_TLOG_UPLOAD" = "false" ] && args="$args --tlog-upload=false"
      cosign sign $args "$1"
    }

.prepare: &prepare
  - export LATEST=$(jq -r '.latest' VERSION)
  - export VERSION=$(jq -r '.version' VERSION)
  - export BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  - jq -r '.plugins[] | "LABEL io.mpoore.packer-ci.plugin.\(.name | sub("^packer-plugin-"; ""))=\"\(.version)\""' PLUGINS >> Dockerfile
  - echo "Building packer-ci image version $VERSION"
  # --provenance=false skips buildx's default build-provenance attestation,
  # so the pushed image is a plain single manifest instead of a manifest
  # index wrapping the image and an attestation manifest.
  - BUILD_ARGS="--build-arg VERSION=$VERSION --build-arg BUILDDATE=$BUILDDATE --build-arg LOCALREGISTRY=$LOCALREGISTRY --provenance=false"

.artifacts: &artifacts
  paths:
    - Dockerfile
    - PLUGINS
    - VERSION

# Trusts a CA for LOCALREGISTRY (the Dockerfile base image mirror) into the
# dind daemon's cert store, so `docker build` can pull through it. Uses
# LOCALREGISTRY_CA_CERT if set; otherwise falls back to reusing
# REGISTRY_CA_CERT, since the mirror is often the same internal registry a
# branch already pushes to. Both are optional File-type CI/CD variables - if
# neither is set, or LOCALREGISTRY itself is unset, this is a no-op.
.localregistry_ca_trust: &localregistry_ca_trust
  - |
    LOCALREGISTRY_CA_CERT="${LOCALREGISTRY_CA_CERT:-$REGISTRY_CA_CERT}"
    if [ -n "$LOCALREGISTRY" ] && [ -n "$LOCALREGISTRY_CA_CERT" ]; then
      LOCALREGISTRY_HOST="${LOCALREGISTRY%%/*}"
      docker run --rm -e CACERT="$(cat "$LOCALREGISTRY_CA_CERT")" -v /etc/docker/certs.d:/certs.d alpine sh -c "mkdir -p /certs.d/$LOCALREGISTRY_HOST && echo \"\$CACERT\" > /certs.d/$LOCALREGISTRY_HOST/ca.crt"
    fi

# Installs the cosign CLI (always the latest release) into the job container.
.cosign_install: &cosign_install
  - |
    apk add -q --no-cache curl 
    COSIGN_VERSION=$(curl -fsSL https://api.github.com/repos/sigstore/cosign/releases/latest | jq -r '.tag_name')
    case "$(uname -m)" in
      x86_64) COSIGN_ARCH=amd64 ;;
      aarch64) COSIGN_ARCH=arm64 ;;
      *) echo "Unsupported architecture for cosign: $(uname -m)" >&2; exit 1 ;;
    esac
    curl -fL --connect-timeout 30 --max-time 60 --retry 5 --retry-delay 5 -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-${COSIGN_ARCH}"
    chmod +x /usr/local/bin/cosign

# Merge request pipelines: build for validation only, never push.
build-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - *prepare
    - *localregistry_ca_trust
    - docker build . $BUILD_ARGS -t packer-ci:$VERSION
  artifacts: *artifacts

# Push jobs: build and push to the registry configured for this branch's
# environment scope. REGISTRY, REGISTRY_TARGET, REGISTRY_USER,
# REGISTRY_PASSWORD and TAG_SUFFIX are CI/CD variables scoped per environment
# (Settings > CI/CD > Variables > Environment scope: "dev" / "main"), so the
# same job template drives every branch - only the environment name changes
# which values apply. REGISTRY_CA_CERT is also environment-scoped and
# optional: set it (as a File-type variable) only for a registry using a
# private/internal CA; leave it unset for a publicly trusted registry and the
# CA-trust step below is skipped entirely.
.build-push: &build-push
  stage: build
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - *prepare
    - *localregistry_ca_trust
    - *cosign_install
    - |
      if [ -n "$REGISTRY_CA_CERT" ]; then
        # Trust the registry's CA for `docker login`/`docker push`, which the
        # dind daemon handles directly. $REGISTRY_CA_CERT is a File-type
        # CI/CD variable, so it's a path in this job's own filesystem; -e
        # streams its content into the dind daemon's certs.d dir (a plain -v
        # bind mount would resolve against the daemon's filesystem, not ours).
        docker run --rm -e CACERT="$(cat "$REGISTRY_CA_CERT")" -v /etc/docker/certs.d:/certs.d alpine sh -c "mkdir -p /certs.d/$REGISTRY && echo \"\$CACERT\" > /certs.d/$REGISTRY/ca.crt"
        # cosign talks to the registry directly from this job container rather
        # than through the dind daemon, so it needs the CA trusted here too.
        cat "$REGISTRY_CA_CERT" >> /etc/ssl/certs/ca-certificates.crt
      fi
    # Build doesn't need registry auth at all (only pulls public alpine, plus
    # curl downloads in the Dockerfile), so it runs before login. Login runs
    # immediately before push rather than before the (20-60s+) build, to avoid
    # leaving a pooled connection idle long enough for the load balancer to
    # drop it before push reuses it - the suspected cause of the "timeout
    # awaiting response headers" failures on the initiate-upload request.
    - docker build . $BUILD_ARGS -t "$REGISTRY_TARGET:$VERSION$TAG_SUFFIX"
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
    - retry docker push --quiet "$REGISTRY_TARGET:$VERSION$TAG_SUFFIX"
    # Sign the tag ref itself rather than a digest resolved via `docker
    # inspect`: buildx's default provenance attestation makes the pushed
    # image a manifest index, and the local daemon's RepoDigests can reflect
    # the inner platform manifest rather than the index digest the tag
    # actually resolves to in the registry. Passing the tag lets cosign
    # resolve it against the registry directly, which is authoritative.
    - cosign_sign "$REGISTRY_TARGET:$VERSION$TAG_SUFFIX"
    - |
      if [ "$LATEST" == "true" ]; then
        docker tag "$REGISTRY_TARGET:$VERSION$TAG_SUFFIX" "$REGISTRY_TARGET:latest$TAG_SUFFIX"
        retry docker push --quiet "$REGISTRY_TARGET:latest$TAG_SUFFIX"
      fi
  artifacts: *artifacts

build-dev:
  <<: *build-push
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  environment: dev

build-main:
  <<: *build-push
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment: main