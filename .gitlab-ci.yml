workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never

variables:
  FF_TIMESTAMPS: true
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build

default:
  image: docker:latest
  services:
    - name: docker:dind

before_script:
  - apk add -q git jq
  # Wait for the dind service to be ready before using the Docker client against it
  - |
    for i in $(seq 1 30); do
      docker info >/dev/null 2>&1 && break
      echo "Waiting for Docker daemon..."
      sleep 1
    done
  - docker info
  # Retry wrapper for flaky network operations (e.g. registry pushes), which
  # have no built-in retry of their own, unlike curl.
  - |
    retry() {
      n=1
      max=5
      delay=10
      until "$@"; do
        if [ "$n" -ge "$max" ]; then
          echo "Command failed after $n attempts: $*" >&2
          return 1
        fi
        echo "Attempt $n/$max failed, retrying in ${delay}s..." >&2
        sleep "$delay"
        n=$((n + 1))
      done
    }

.prepare: &prepare
  - export LATEST=$(jq -r '.latest' VERSION)
  - export VERSION=$(jq -r '.version' VERSION)
  - export BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  - jq -r '.plugins[] | "LABEL io.mpoore.packer-ci.plugin.\(.name)=\"\(.version)\""' PLUGINS >> Dockerfile
  - echo "Building packer-ci image version $VERSION"
  - BUILD_ARGS="--build-arg VERSION=$VERSION --build-arg BUILDDATE=$BUILDDATE --build-arg LOCALREGISTRY=$LOCALREGISTRY"

.artifacts: &artifacts
  paths:
    - Dockerfile
    - PLUGINS
    - VERSION

# Merge request pipelines: build for validation only, never push.
build-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - *prepare
    - docker build . $BUILD_ARGS -t packer-ci:$VERSION
  artifacts: *artifacts

# dev branch: push to the local Harbor instance.
build-dev:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - *prepare
    # Trust Harbor's CA for `docker login`/`docker push`, which the dind daemon
    # handles directly. $HARBOR_CA_CERT is a File-type CI/CD variable, so it's a
    # path in this job's own filesystem; -e streams its content into the dind
    # daemon's certs.d dir (a plain -v bind mount would resolve against the
    # daemon's filesystem, not ours).
    - docker run --rm -e CACERT="$(cat "$HARBOR_CA_CERT")" -v /etc/docker/certs.d:/certs.d alpine sh -c "mkdir -p /certs.d/$HARBOR_REGISTRY && echo \"\$CACERT\" > /certs.d/$HARBOR_REGISTRY/ca.crt"
    # Build doesn't need registry auth at all (only pulls public alpine, plus
    # curl downloads in the Dockerfile), so it runs before login. Login runs
    # immediately before push rather than before the (20-60s+) build, to avoid
    # leaving a pooled connection idle long enough for the load balancer to
    # drop it before push reuses it - the suspected cause of the "timeout
    # awaiting response headers" failures on the initiate-upload request.
    - docker build . $BUILD_ARGS -t "$HARBOR_TARGET:$VERSION-dev"
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
    - retry docker push --quiet "$HARBOR_TARGET:$VERSION-dev"
    - |
      if [ "$LATEST" == "true" ]; then
        docker tag "$HARBOR_TARGET:$VERSION-dev" "$HARBOR_TARGET:latest-dev"
        retry docker push --quiet "$HARBOR_TARGET:latest-dev"
      fi
  artifacts: *artifacts

# main branch: push to the public Docker registry.
build-main:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *prepare
    # Build before login, and login immediately before push - see build-dev for
    # why (avoids an idle pooled connection getting dropped by the load
    # balancer between login and push).
    - docker build . $BUILD_ARGS -t "$DOCKER_TARGET:$VERSION"
    - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USER" --password-stdin
    - retry docker push --quiet "$DOCKER_TARGET:$VERSION"
    - |
      if [ "$LATEST" == "true" ]; then
        docker tag "$DOCKER_TARGET:$VERSION" "$DOCKER_TARGET:latest"
        retry docker push --quiet "$DOCKER_TARGET:latest"
      fi
  artifacts: *artifacts