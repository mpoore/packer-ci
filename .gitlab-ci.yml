workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never

variables:
  FF_TIMESTAMPS: true
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PLATFORMS: "linux/amd64,linux/arm64"

stages:
  - build

default:
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]

before_script:
  - apk add -q git jq
  # Wait for the dind service to be ready before using the Docker client against it
  - |
    for i in $(seq 1 30); do
      docker info >/dev/null 2>&1 && break
      echo "Waiting for Docker daemon..."
      sleep 1
    done
  - docker info
  # Register QEMU emulators so buildx can build non-native architectures on this runner
  - docker run --rm --privileged tonistiigi/binfmt --install all
  - docker buildx create --name packerci --driver docker-container --use
  - docker buildx inspect --bootstrap

.prepare: &prepare
  - export LATEST=$(jq -r '.latest' VERSION)
  - export VERSION=$(jq -r '.version' VERSION)
  - export BUILDDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
  - jq -r '.plugins[] | "LABEL io.mpoore.packer-ci.plugin.\(.name)=\"\(.version)\""' PLUGINS >> Dockerfile
  - echo "Building packer-ci image version $VERSION for platforms $PLATFORMS"
  - BUILD_ARGS="--build-arg VERSION=$VERSION --build-arg BUILDDATE=$BUILDDATE --build-arg LOCALREGISTRY=$LOCALREGISTRY"

.artifacts: &artifacts
  paths:
    - Dockerfile
    - PLUGINS
    - VERSION

# Merge request pipelines: build for validation only, never push.
build-mr:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - *prepare
    - docker buildx build . --platform="$PLATFORMS" $BUILD_ARGS -t packer-ci:$VERSION
  artifacts: *artifacts

# dev branch: push to the local Harbor instance.
build-dev:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  services:
    - name: docker:dind
      command: ["--tls=false"]
      variables:
        DOCKER_OPTS: "--insecure-registry=$HARBOR_REGISTRY"
  script:
    - *prepare
    # The docker-container buildx driver runs its own BuildKit container, which
    # doesn't inherit the dind daemon's --insecure-registry setting, so it needs
    # its own registry config to accept Harbor's untrusted certificate.
    - docker buildx rm packerci || true
    - |
      cat <<EOF > /tmp/buildkitd.toml
      [registry."$HARBOR_REGISTRY"]
        insecure = true
      EOF
    - docker buildx create --name packerci --driver docker-container --buildkitd-config /tmp/buildkitd.toml --use
    - docker buildx inspect --bootstrap
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin
    - TAGS="-t $HARBOR_TARGET:$VERSION"
    - |
      if [ "$LATEST" == "true" ]; then
        TAGS="$TAGS -t $HARBOR_TARGET:latest"
      fi
    - docker buildx build . --platform="$PLATFORMS" $BUILD_ARGS $TAGS --push
  artifacts: *artifacts

# main branch: push to the public Docker registry.
build-main:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - *prepare
    - echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USER" --password-stdin
    - TAGS="-t $DOCKER_TARGET:$VERSION"
    - |
      if [ "$LATEST" == "true" ]; then
        TAGS="$TAGS -t $DOCKER_TARGET:latest"
      fi
    - docker buildx build . --platform="$PLATFORMS" $BUILD_ARGS $TAGS --push
  artifacts: *artifacts